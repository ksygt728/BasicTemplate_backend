version: '3.8'

services:
  mysql-qa:
    image: mysql:8.0
    container_name: CBSK-DB-QA
    environment:
      MYSQL_ROOT_PASSWORD: root961019
      MYSQL_DATABASE: CBSK-QA
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-qa-data:/var/lib/mysql

  redis-qa:
    image: redis:latest
    container_name: CBSK-REDIS-QA
    environment:
      TZ: Asia/Seoul
    ports:
      - "6380:6379"
    volumes:
      - redis-qa-data:/data
  zookeeper-qa:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: CBSK-ZOOKEEPER-QA
    ports:
      - "2182:2181"  # QA용 Zookeeper 포트 (겹치지 않게)
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  broker-qa:
    image: confluentinc/cp-kafka:7.5.0
    container_name: CBSK-BROKER-QA
    ports:
      - "9093:9092"  # QA용 Kafka 포트
    environment:
      KAFKA_ZOOKEEPER_CONNECT: CBSK-ZOOKEEPER-QA:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://CBSK-BROKER-QA:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui-qa:
    image: provectuslabs/kafka-ui:latest
    container_name: CBSK-KAFKA-UI-QA
    ports:
      - "9081:8080"  # QA용 Kafka UI 포트
    environment:
      KAFKA_CLUSTERS_0_NAME: qa
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: CBSK-BROKER-QA:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: CBSK-ZOOKEEPER-QA:2181
    depends_on:
      - CBSK-BROKER-QA
      - CBSK-ZOOKEEPER-QA

  jenkins:
    image: jenkins/jenkins:lts
    container_name: CBSK-JENKINS-QA
    restart: unless-stopped
    privileged: true # 도커 명령어 실행을 위해 필요
    user: root
    ports:
      - "9901:8080"   # 웹 UI
      - "50010:50000" # 에이전트 포트
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul
    volumes:
      - jenkins_home-qa:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker # 호스트의 docker 바이너리 공유
volumes:
  mysql-qa-data:
  redis-qa-data:
  jenkins_home-qa: