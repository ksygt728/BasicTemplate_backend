version: "3.9"

services:
  back:
    image: cbms-back:${IMAGE_TAG}
    container_name: cbms-back
    restart: always
    ports:
      - "${BACK_PORT}:8080"
    env_file:
      - .env.${ENV}
    environment:
      SPRING_PROFILES_ACTIVE: ${ENV}
    networks:
      - cbms-net

networks:
  cbms-net:
    external: true
