version: "3.9"

services:
  back:
    image: ${REGISTRY}/${IMAGE_NAME}-${ENV}:${IMAGE_TAG}
    container_name: ${IMAGE_NAME}-${ENV}
    restart: always
    ports:
      - "${BACK_PORT}:8080"
    env_file:
      - application-${ENV}.yml
    environment:
      SPRING_PROFILES_ACTIVE: ${ENV}
    networks:
      - cbms-net

networks:
  cbms-net:
    external: true
