version: "3.8"

services:
  mysql-dev:
    image: mysql:8.0
    container_name: CBMS-DB-LOCAL
    environment:
      MYSQL_ROOT_PASSWORD: root961019
      MYSQL_DATABASE: CBMS
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    logging:
      driver: "none"
    volumes:
      - mysql-dev-data:/var/lib/mysql

  redis-dev:
    image: redis:latest
    container_name: CBMS-REDIS-LOCAL
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    logging:
      driver: "none"
    volumes:
      - redis-dev-data:/data

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: CBMS-ZOOKEEPER-LOCAL
    ports:
      - "2181:2181"
    logging:
      driver: "none"

  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    container_name: CBMS-KAFKA-LOCAL
    ports:
      - "9092:9092" # 로컬 PC에서 접속할 포트
    logging:
      driver: "none"
    environment:
      # old
      # KAFKA_ADVERTISED_HOST_NAME: kafka
      # KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # new
      # ✅ 문제 해결 1: localhost만으로 advertised 하면 컨테이너 내부 서비스(kafka-ui 등)에서 접근 불가
      # 외부(Spring Boot 등)에서 접근 가능한 주소와 내부 컨테이너끼리 통신 가능한 주소를 각각 명시
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      # ✅ 문제 해결 2: listener 이름마다 프로토콜을 지정
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      # ✅ 문제 해결 3: 실제로 브로커가 바인딩할 포트를 명시해야 연결됨
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      # ✅ 문제 해결 4: 브로커 간 통신 시 INTERNAL 리스너 사용
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 기본 Zookeeper 설정
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: CBMS-KAFKA-UI-LOCAL
    logging:
      driver: "none"
    ports:
      - "9080:8080"
    depends_on:
      - kafka
      - zookeeper
    environment:
      # old
      # - DYNAMIC_CONFIG_ENABLED=true
      # - KAFKA_CLUSTERS_0_NAME=local
      # - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      # - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      # new
      # ✅ 문제 해결 5: Kafka UI에서 동적 설정을 허용
      - DYNAMIC_CONFIG_ENABLED=true
      # ✅ 문제 해결 6: kafka-ui가 내부 네트워크에서 Kafka에 접근할 수 있도록 INTERNAL 주소로 설정
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181

  jenkins:
    image: jenkins/jenkins:lts
    container_name: CBMS-JENKINS-LOCAL
    restart: unless-stopped
    privileged: true # 도커 명령어 실행을 위해 필요
    user: root
    ports:
      - "9900:8080" # 웹 UI
      - "50005:50000" # 에이전트 포트
    logging:
      driver: "none"
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul
    volumes:
      - jenkins_home-dev:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker # 호스트의 docker 바이너리 공유

volumes:
  mysql-dev-data:
  redis-dev-data:
  jenkins_home-dev:
