version: "3.8"

services:
  mysql-qa:
    image: mysql:8.0
    container_name: CBSK-DB-QA
    environment:
      MYSQL_ROOT_PASSWORD: root961019
      MYSQL_DATABASE: CBSK-QA
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    logging:
      driver: "none"
    volumes:
      - mysql-qa-data:/var/lib/mysql

  redis-qa:
    image: redis:latest
    container_name: CBSK-REDIS-QA
    environment:
      TZ: Asia/Seoul
    ports:
      - "6380:6379"
    logging:
      driver: "none"
    volumes:
      - redis-qa-data:/data

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: CBSK-ZOOKEEPER-QA
    ports:
      - "2182:2181" # QA용 포트 분리
    logging:
      driver: "none"

  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    container_name: CBSK-KAFKA-QA
    ports:
      - "9093:9092" # QA용 포트 분리
    logging:
      driver: "none"
    environment:
      # 외부 접근을 위한 리스너 설정
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: CBSK-KAFKA-UI-QA
    ports:
      - "9081:8080" # QA용 포트 분리
    logging:
      driver: "none"
    depends_on:
      - kafka
      - zookeeper
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=qa
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181

volumes:
  mysql-qa-data:
  redis-qa-data:
