version: '3.8'

services:
  mysql-dev:
    image: mysql:8.0
    container_name: CBSK-DB-DEV
    environment:
      MYSQL_ROOT_PASSWORD: root961019
      MYSQL_DATABASE: CBSK-DEV
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql

  redis-dev:
    image: redis:latest
    container_name: CBSK-REDIS-DEV
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data


  CBSK-ZOOKEEPER-DEV:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: CBSK-ZOOKEEPER-DEV
    ports:
      - "2181:2181"  # Zookeeper 기본 포트
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  CBSK-BROKER-DEV:
    image: confluentinc/cp-kafka:7.5.0
    container_name: CBSK-BROKER-DEV
    ports:
      - "9092:9092"  # Kafka 브로커 포트
    environment:
      KAFKA_ZOOKEEPER_CONNECT: CBSK-ZOOKEEPER-DEV:2181  # Zookeeper와 연결
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://CBSK-BROKER-DEV:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui-dev:
    image: provectuslabs/kafka-ui:latest
    container_name: CBSK-KAFKA-UI-DEV
    ports:
      - "9080:8080"  # UI 포트 매핑
    environment:
      KAFKA_CLUSTERS_0_NAME: dev  # 클러스터 이름
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: CBSK-BROKER-DEV:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: CBSK-ZOOKEEPER-DEV:2181
    depends_on:
      - CBSK-BROKER-DEV
      - CBSK-ZOOKEEPER-DEV

  jenkins:
    image: jenkins/jenkins:lts
    container_name: CBSK-JENKINS-DEV
    restart: unless-stopped
    privileged: true # 도커 명령어 실행을 위해 필요
    user: root
    ports:
      - "9900:8080"   # 웹 UI
      - "50005:50000" # 에이전트 포트
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul
    volumes:
      - jenkins_home-dev:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker # 호스트의 docker 바이너리 공유

volumes:
  mysql-dev-data:
  redis-dev-data:
  jenkins_home-dev: