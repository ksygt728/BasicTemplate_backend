version: '3.8'

services:
  mysql-dev:
    image: mysql:8.0
    container_name: CBSK-DB-DEV
    environment:
      MYSQL_ROOT_PASSWORD: root961019
      MYSQL_DATABASE: CBSK-DEV
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql

  redis-dev:
    image: redis:latest
    container_name: CBSK-REDIS-DEV
    environment:
      TZ: Asia/Seoul
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data

  zookeeper-dev:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: CBSK-ZOOKEEPER-DEV
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka-dev:
    image: confluentinc/cp-kafka:7.4.0
    container_name: CBSK-KAFKA-DEV
    depends_on:
      - zookeeper-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-dev:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  mysql-dev-data:
  redis-dev-data: