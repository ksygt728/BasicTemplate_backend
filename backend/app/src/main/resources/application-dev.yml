# [dev 프로필 전용 설정 파일]
server:
  port: 8080 # 개발 서버 포트

spring:
  profiles:
    group:
      dev: dev
  env: dev # 현재 환경이 dev임을 명시적으로 표시
  datasource:
    url: jdbc:mysql://localhost:3306/CBSK-DEV?useUnicode=true&serverTimezone=Asia/Seoul # 개발 DB 접속 URL (DOCKER DB명: CBSK-DEV)
    username: root
    password: root961019
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL 드라이버
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect # Hibernate가 사용할 DB 방언(Dialect) 지정 (MySQL8Dialect로 변경)
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 DDL 자동 생성/수정 옵션 (none, update, create, create-drop 등)
    properties:
      hibernate:
        show_sql: true # 실행되는 SQL 쿼리를 콘솔에 출력
        format_sql: true # SQL 쿼리를 보기 좋게 포맷팅해서 출력
        use_sql_comments: true # SQL 쿼리에 주석 추가해서 출력
  logging:
    level:
      org:
        hibernate: info # Hibernate의 로그 레벨 설정 (info, debug, error 등)
        hibernate.type.descriptor.sql: trace # SQL 파라미터 바인딩 값까지 로그로 출력
