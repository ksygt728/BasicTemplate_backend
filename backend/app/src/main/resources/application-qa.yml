# [qa 프로필 전용 설정 파일]
server:
  port: 8081 # QA 서버 포트

spring:
  profiles:
    group:
      env: qa

  datasource:
    url: jdbc:mysql://localhost:3307/CBSK-QA?useUnicode=true&serverTimezone=Asia/Seoul # QA DB 접속 URL (DOCKER DB명: CBSK-QA)
    username: root
    password: root961019
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL 드라이버
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect # Hibernate가 사용할 DB 방언(Dialect) 지정 (MySQL8Dialect로 변경)
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 DDL 자동 생성/수정 옵션
    properties:
      hibernate:
        show_sql: false # SQL 쿼리 콘솔 출력 비활성화
        format_sql: false # SQL 쿼리 포맷팅 비활성화
        use_sql_comments: false # SQL 쿼리 주석 비활성화

  quartz:
    job-store-type: jdbc # Quartz 상태 저장 방식을 JDBC(DB)로 설정
    jdbc:
      initialize-schema: never # 스키마 자동 생성 비활성화 (직접 SQL 실행 후 사용)
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MyClusteredScheduler # 스케줄러 이름, 클러스터 내 구분용
            instanceId: AUTO # 클러스터 노드별 고유 ID 자동 생성

          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX # 트랜잭션 지원하는 JDBC JobStore 구현체
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate # MySQL용 드라이버 델리게이트
            useProperties: false # 잡 데이터 저장시 별도 properties 사용 안함
            dataSource: myDS # 사용할 데이터소스 이름
            tablePrefix: QRTZ_ # Quartz 테이블 접두사
            isClustered: true # 클러스터링 활성화
            clusterCheckinInterval: 20000 # 클러스터 상태 점검 주기 (밀리초, 20초)

          threadPool:
            threadCount: 10 # Quartz 스레드 풀 크기 (동시 실행 가능한 잡 수)

          dataSource:
            myDS:
              driver: com.mysql.cj.jdbc.Driver # 데이터소스 드라이버
              URL: jdbc:mysql://localhost:3307/CBSK-QUARTZ?useUnicode=true&serverTimezone=Asia/Seoul
              user: root # 데이터소스 사용자명
              password: root961019 # 데이터소스 비밀번호

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 30000ms

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: log-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500 # 한 번에 가져올 최대 레코드 수
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 600000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.type.mapping]": "LogApi:com.basic.app.entity.LogApi"
    listener:
      missing-topics-fatal: false # 리스너가 시작 시 존재하지 않는 토픽이 있어도 예외 발생시키지 않음 (개발 편의 목적)

