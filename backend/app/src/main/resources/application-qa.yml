  kakao:
    api-key: 305da1aa1489acfde40743eecdd25716 # 카카오 API 키
    client-secret-key: K5PHcStiFJhdhx1nlu4Bgrzx2jewx6iz # 카카오 클라이언트 시크릿 키
    redirect-uri: http://localhost:8080/api/auth/kakao # 카카오 인증 리다이렉트 URI
    access-token-uri: https://kauth.kakao.com/oauth/token # 카카오 액세스 토큰 발급 URI

logging:
  level:
    root: info # 기본 로깅 레벨
    org:
      jooq: debug
      "[jooq.tools]": debug
      "[jooq.tools.LoggerListener]": debug
      "[springframework.kafka]": error
      hibernate:
        SQL: debug # 실행되는 SQL 출력
        orm:
          jdbc:
            bind: trace # Hibernate 6 이상에서 바인딩 값 출력
  pattern:
    # console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [ %-5level] %logger{36} - %msg%n" # 콘솔 출력 포맷
    console: "\u001B[1;36m%d{yyyy-MM-dd HH:mm:ss.SSS}\u001B[0m \u001B[35m[%thread]\u001B[0m \u001B[1;33m[%level]\u001B[0m \u001B[32m%logger{36}\u001B[34m - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] %logger{36} - %msg%n"

jwt:
  env: qa # 현재 활성화된 프로필 설정 (dev 프로필 사용)
  access-token-header: Authorization-AccessToken-QA
  refresh-token-header: Authorization-RefreshToken-QA
  bearer-type: Bearer
  issuer: CBSK SERVER(QA)
  subject:
    first: CBSK JWT TOKEN
    second: userId
    third: phoneNum
  expire-time:
    access-token: 10m # 10분 = 1000 * 60 * 10
    refresh-token: 60d
  dead-time-for-server: 10s # 10초
  secret-key: CBSK-DEV-SECRET-KEY # JWT 서명에 사용할 비밀 키

springdoc:
  swagger-ui:
    path: /swagger-ui # Swagger UI 접속 URL 변경
    operations-sorter: method # 정렬 방식 (alpha, method)
    tags-sorter: alpha
  api-docs:
    path: /api-docs
