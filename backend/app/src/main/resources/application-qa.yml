# [qa 프로필 전용 설정 파일]
server:
  port: 8081 # QA 서버 포트

spring:
  profiles:
    group:
      qa: qa
  datasource:
    url: jdbc:mysql://localhost:3307/CBSK-QA?useUnicode=true&serverTimezone=Asia/Seoul # QA DB 접속 URL (DOCKER DB명: CBSK-QA)
    username: root
    password: root961019
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL 드라이버
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect # Hibernate가 사용할 DB 방언(Dialect) 지정 (MySQL8Dialect로 변경)
    hibernate:
      ddl-auto: update # 애플리케이션 실행 시 DDL 자동 생성/수정 옵션
    properties:
      hibernate:
        show_sql: false # SQL 쿼리 콘솔 출력 비활성화
        format_sql: false # SQL 쿼리 포맷팅 비활성화
        use_sql_comments: false # SQL 쿼리 주석 비활성화

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 30000ms

  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: log-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500 # 한 번에 가져올 최대 레코드 수
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 600000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.type.mapping]": "LogApi:com.basic.app.entity.LogApi"
    listener:
      missing-topics-fatal: false # 리스너가 시작 시 존재하지 않는 토픽이 있어도 예외 발생시키지 않음 (개발 편의 목적)

logging:
  level:
    root: info # 기본 로깅 레벨
    org:
      jooq: debug
      "[jooq.tools]": debug
      "[jooq.tools.LoggerListener]": debug
      "[springframework.kafka]": error
      hibernate:
        SQL: debug # 실행되는 SQL 출력
        orm:
          jdbc:
            bind: trace # Hibernate 6 이상에서 바인딩 값 출력
  pattern:
    # console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [ %-5level] %logger{36} - %msg%n" # 콘솔 출력 포맷
    console: "\u001B[36m%d{yyyy-MM-dd HH:mm:ss.SSS}\u001B[0m \u001B[35m[%thread]\u001B[0m \u001B[33m[%-5level]\u001B[0m \u001B[32m%logger{36}\u001B[0m - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] %logger{36} - %msg%n"

jwt:
  env: qa # 현재 활성화된 프로필 설정 (dev 프로필 사용)
  access-token-header: Authorization-AccessToken-QA
  refresh-token-header: Authorization-RefreshToken-QA
  bearer-type: Bearer
  issuer: CBSK SERVER(QA)
  subject:
    first: CBSK JWT TOKEN
    second: userId
    third: phoneNum
  expire-time:
    access-token: 10m # 10분 = 1000 * 60 * 10
    refresh-token: 60d
  dead-time-for-server: 10s # 10초
  secret-key: CBSK-DEV-SECRET-KEY # JWT 서명에 사용할 비밀 키
