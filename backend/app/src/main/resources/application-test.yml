server:
  port: 0 # ✅ 테스트 시 포트 사용 안 함

front-end:
  url: http://localhost:3000

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        "[jdbc.batch_size]": 100
        "[show_sql]": false
        "[format_sql]": true
        "[use_sql_comments]": true

  # ✅ Quartz 완전 비활성화
  quartz:
    enabled: false

  # ✅ Redis 비활성화 (필요 시 TestConfiguration으로 Mock)
  data:
    redis:
      repositories:
        enabled: false

  # ✅ Kafka 자동 시작 방지
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    root: info
    org:
      jooq: warn
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace
    com.basic.app.featureTest: debug

jwt:
  env: test
  testId: ADMIN
  access-token-header: Authorization-AccessToken-DEV
  refresh-token-header: Authorization-RefreshToken-DEV
  bearer-type: Bearer
  issuer: CBSK SERVER(TEST)
  expire-time:
    access-token: 10m
    refresh-token: 1d
  secret-key: TEST-SECRET-KEY

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
