# [prod 프로필 전용 설정 파일]
server:
  port: 8082 # 운영 서버 포트

spring:
  profiles:
    group:
      prod: prod
  datasource:
    url: jdbc:mysql://localhost:3308/CBSK-PROD?useUnicode=true&serverTimezone=Asia/Seoul # 운영 DB 접속 URL (DOCKER DB명: CBSK-PROD)
    username: root
    password: root961019
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL 드라이버
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect # Hibernate가 사용할 DB 방언(Dialect) 지정 (MySQL8Dialect로 변경)
    hibernate:
      ddl-auto: none # 운영에서는 보통 DDL 자동 변경을 막음
    properties:
      hibernate:
        show_sql: false # SQL 쿼리 콘솔 출력 비활성화
        format_sql: false # SQL 쿼리 포맷팅 비활성화
        use_sql_comments: false # SQL 쿼리 주석 비활성화

  data:
    redis:
      host: localhost
      port: 6381
      timeout: 30000ms

logging:
  level:
    org:
      hibernate:
        SQL: error # 최소한의 SQL 로그만
        orm:
          jdbc:
            bind: off # 바인딩 값 로그 비활성화
    org.jooq: ERROR
    org.jooq.tools: ERROR
    org.jooq.tools.LoggerListener: ERROR

jwt:
  env: prod # 현재 활성화된 프로필 설정 (prod 프로필 사용)
  access-token-header: Authorization-AccessToken-PROD
  refresh-token-header: Authorization-RefreshToken-PROD
  bearer-type: Bearer
  issuer: CBSK SERVER(PROD)
  subject:
    first: CBSK JWT TOKEN
    second: userId
    third: phoneNum
  expire-time:
    access-token: 10m # 10분 = 1000 * 60 * 10
    refresh-token: 60d
  dead-time-for-server: 10s # 10초
  secret-key: CBSK-DEV-SECRET-KEY # JWT 서명에 사용할 비밀 키
