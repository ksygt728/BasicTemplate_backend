logging:
  level:
    root: info # 기본 로깅 레벨
    org:
      jooq: debug
      "[jooq.tools]": debug
      "[jooq.tools.LoggerListener]": debug
      "[springframework.kafka]": error
      hibernate:
        SQL: debug # 실행되는 SQL 출력
        orm:
          jdbc:
            bind: trace # Hibernate 6 이상에서 바인딩 값 출력
  pattern:
    console: "\u001B[1;36m%d{yyyy-MM-dd HH:mm:ss.SSS}\u001B[0m \u001B[35m[%thread]\u001B[0m \u001B[1;33m[%level]\u001B[0m \u001B[32m%logger{36}\u001B[34m - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] %logger{36} - %msg%n"

jwt:
  env: prod # 현재 활성화된 프로필 설정 (prod 프로필 사용)
  access-token-header: Authorization-AccessToken-PROD
  refresh-token-header: Authorization-RefreshToken-PROD
  bearer-type: Bearer
  issuer: CBSK SERVER(PROD)
  subject:
    first: CBSK JWT TOKEN
    second: userId
    third: phoneNum
    fourth: roles
  expire-time:
    access-token: 10m # 10분 = 1000 * 60 * 10
    refresh-token: 60d
  dead-time-for-server: 10s # 10초
  secret-key: CBSK-PROD-SECRET-KEY-KSYGT728-ORI-IS-THE-BEST-ANIMAL # JWT 서명에 사용할 비밀 키

springdoc:
  swagger-ui:
    enabled: true # UI 활성화
    path: /swagger-ui.html # 기본 접속 경로 지정
    operations-sorter: method # 정렬 방식 (alpha, method)
    tags-sorter: alpha
  api-docs:
    enabled: true # openApi 문서 활성화
    path: /api-docs
  override-with-generic-response: false # 일반화된 응답 사용 여부 결정
